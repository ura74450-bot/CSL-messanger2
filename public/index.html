<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Мессенджер</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--acc:#7c5cff;--acc2:#3ecbff;--txt:#eef1f6;--mut:#8b94a5;--g:linear-gradient(135deg,#7c5cff,#3ecbff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100dvh;background:#07090d;color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;overflow:hidden}
#root{position:relative;width:100%;max-width:480px;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:500px){body{align-items:center}#root{height:min(900px,96dvh);border-radius:28px;box-shadow:0 30px 80px #000a;border:1px solid #ffffff12}}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--txt);outline:0}
svg{width:24px;height:24px;display:block}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden;color:#fff;background:var(--card2)}
.av img{width:100%;height:100%;object-fit:cover;animation:fade .4s}
.av.sm{width:40px;height:40px;font-size:16px}.av.xl{width:112px;height:112px;font-size:44px}
.fld{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ffffff14;background:var(--card);transition:.2s}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 3px #7c5cff30}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--g);font-weight:600;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--card2)}.btn.red{background:#3a1d24;color:#ff6b7d}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.85)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bump{40%{transform:scale(1.18) rotate(4deg)}}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(2.2);opacity:0}}
@keyframes blink{50%{opacity:.2}}
/* auth */
#auth{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px;background:radial-gradient(circle at 20% 0,#7c5cff40,transparent 50%),radial-gradient(circle at 90% 100%,#3ecbff30,transparent 50%),var(--bg);animation:fade .4s}
#auth>*{animation:up .5s backwards}#auth>:nth-child(2){animation-delay:.05s}#auth>:nth-child(3){animation-delay:.1s}#auth>:nth-child(4){animation-delay:.15s}#auth>:nth-child(5){animation-delay:.2s}#auth>:nth-child(6){animation-delay:.25s}
.logo{width:84px;height:84px;border-radius:26px;background:var(--g);display:grid;place-items:center;margin:0 auto;animation:float 3.5s infinite ease-in-out!important;box-shadow:0 14px 40px #7c5cff55}
.logo svg{width:44px;height:44px;stroke:#fff}
#auth h1{margin:6px 0 0;text-align:center;font-size:26px}
.link{color:var(--acc2);text-align:center;padding:8px}.err{color:#ff6b7d;text-align:center;min-height:20px}
/* tabs & nav */
.tab{position:absolute;inset:0 0 calc(64px + env(safe-area-inset-bottom)) 0;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s}
.tab.on{opacity:1;pointer-events:auto;transform:none}
#app.swap .tab{opacity:0;transform:scale(.97)}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#12161dd9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #ffffff10;z-index:5}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);transition:color .25s}
#nav button svg{transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
#nav button.on{color:#fff}#nav button.on svg{transform:translateY(-2px) scale(1.18);stroke:var(--acc2)}
#ind{position:absolute;top:0;left:0;width:50%;height:3px;display:flex;justify-content:center;transition:transform .4s cubic-bezier(.4,1.4,.5,1)}
#ind i{width:44px;height:3px;border-radius:0 0 4px 4px;background:var(--g)}
.badge{position:absolute;margin:-26px -26px 0 0;min-width:18px;height:18px;border-radius:9px;background:#ff4d6a;font-size:11px;display:grid;place-items:center;padding:0 5px}
/* chats list */
.top{padding:18px 18px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:2}
.top h2{margin:0 0 12px;font-size:28px}
.row{display:flex;gap:12px;align-items:center;padding:10px 18px;cursor:pointer;transition:background .2s;animation:up .45s backwards;animation-delay:calc(var(--i,0)*45ms)}
.row:active,.row:hover{background:#ffffff08}
.row .mid{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.unr{background:var(--g);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;animation:pop .3s}
.empty{text-align:center;color:var(--mut);padding:60px 30px;animation:up .5s}
/* chat */
#chat{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .4s cubic-bezier(.3,.9,.3,1)}
#chat.open{transform:none}
.ch-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#12161d;border-bottom:1px solid #ffffff10}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:.2s}.ib:active{transform:scale(.88);background:#ffffff12}
#ch-user{flex:1;display:flex;align-items:center;gap:10px;min-width:0}#ch-user b{display:block}#ch-user small{color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 80% 0,#7c5cff14,transparent 50%)}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;word-break:break-word;white-space:pre-wrap;position:relative}
.msg.anim{animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.msg.me{align-self:flex-end;background:var(--g);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;text-align:right;margin-top:2px}
.msg.img{padding:4px}.msg.img img{display:block;max-width:100%;width:240px;border-radius:14px;cursor:zoom-in;animation:fade .5s}
.msg.img time{position:absolute;right:10px;bottom:8px;background:#0008;padding:1px 6px;border-radius:8px;margin:0}
.voice{display:flex;align-items:center;gap:10px;min-width:190px}
.pl{width:38px;height:38px;border-radius:50%;background:#fff3;display:grid;place-items:center;flex:none;transition:transform .15s}.pl:active{transform:scale(.88)}.pl svg{width:18px;height:18px}
.bar{flex:1;height:5px;border-radius:3px;background:#fff3;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s linear}
.dur{font-size:12px;min-width:34px}
.inp{display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#12161d;border-top:1px solid #ffffff10}
.inp input[type=text]{flex:1;padding:12px 16px;border-radius:22px;border:0;background:var(--card2)}
#sb{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;transition:transform .15s}#sb:active{transform:scale(.88)}
#sb svg{animation:pop .3s;width:22px;height:22px}
.rec{flex:1;display:flex;align-items:center;gap:10px;padding-left:10px;animation:up .25s}
.rec i{width:12px;height:12px;border-radius:50%;background:#ff4d6a;animation:blink 1s infinite}
/* profile */
.prof{padding:30px 22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.prof>*{animation:up .5s backwards}.prof>:nth-child(2){animation-delay:.06s}.prof>:nth-child(3){animation-delay:.12s}.prof>:nth-child(4){animation-delay:.18s}
.avw{position:relative;cursor:pointer}.avw .cam{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;background:var(--g);display:grid;place-items:center;border:3px solid var(--bg)}.cam svg{width:18px;height:18px}
.bump{animation:bump .6s}
.accs{width:100%;background:var(--card);border-radius:18px;padding:6px 0;margin-top:6px}
.accs h4{margin:10px 18px 4px;color:var(--mut);font-weight:500}
.chk{color:var(--acc2);font-weight:700}
/* call */
#call{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:90px 20px 70px;background:radial-gradient(circle at 50% 30%,#4a35b8,#0e1116 70%);opacity:0;pointer-events:none;transform:scale(1.08);transition:.35s}
#call.on{opacity:1;pointer-events:auto;transform:none}
.cav{position:relative;margin:0 auto}.cav::before,.cav::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc2);animation:ring 2s infinite}.cav::after{animation-delay:1s}
#call.live .cav::before,#call.live .cav::after{animation-play-state:paused;opacity:0}
#call h2{margin:22px 0 4px;text-align:center}#c-st{text-align:center;color:#ffffffaa}
.ctl{display:flex;gap:30px}.cb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;transition:.2s}.cb:active{transform:scale(.88)}
.cb.red{background:#ff4d6a}.cb.green{background:#2fd26f;animation:float 1.4s infinite}.cb.mute.on{background:#fff;color:#111}
#call[data-mode=in] .c-out,#call[data-mode=out] .c-in{display:none}
#lb{position:absolute;inset:0;z-index:50;background:#000e;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.3s}#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:96%;max-height:90%;border-radius:12px;transform:scale(.9);transition:.35s}#lb.on img{transform:none}
#toast{position:absolute;left:50%;top:16px;z-index:60;transform:translate(-50%,-80px);background:#232a36;padding:10px 18px;border-radius:16px;box-shadow:0 8px 30px #0008;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="root">
  <div id="auth" class="hide">
    <div class="logo" id="alogo"></div>
    <h1 id="atitle">Вход</h1>
    <input class="fld" id="a-name" placeholder="Имя" maxlength="30">
    <input class="fld" id="a-nick" placeholder="Никнейм" autocapitalize="off" autocomplete="username">
    <input class="fld" id="a-pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="a-err"></div>
    <button class="btn" id="a-go">Войти</button>
    <button class="link" id="a-sw">Нет аккаунта? Регистрация</button>
    <button class="link hide" id="a-cancel">Отмена</button>
  </div>

  <div id="app" class="hide">
    <section class="tab on" id="tab-chats">
      <div class="top"><h2>Чаты</h2><input class="fld" id="q" placeholder="Поиск по никнейму…" autocapitalize="off"></div>
      <div id="list"></div>
    </section>
    <section class="tab" id="tab-profile"></section>
    <nav id="nav">
      <div id="ind"><i></i></div>
      <button data-t="chats" class="on"><span id="n-chats"></span>Чаты</button>
      <button data-t="profile"><span id="n-prof"></span>Профиль</button>
    </nav>
    <section id="chat">
      <div class="ch-h">
        <button class="ib" id="back"></button>
        <div id="ch-user"></div>
        <button class="ib" id="callbtn"></button>
      </div>
      <div id="msgs"></div>
      <div class="inp" id="inp">
        <button class="ib" id="photo"></button>
        <input type="text" id="txt" placeholder="Сообщение" autocomplete="off">
        <button id="sb"></button>
      </div>
      <div class="inp hide" id="recbar">
        <button class="ib" id="rc"></button>
        <div class="rec"><i></i><span id="rt">0:00</span></div>
        <button id="rs" class="ib" style="background:var(--g)"></button>
      </div>
    </section>
  </div>

  <div id="call" data-mode="out">
    <div><div class="cav" id="c-av"></div><h2 id="c-name"></h2><div id="c-st"></div></div>
    <div class="ctl c-in"><button class="cb red" id="c-dec"></button><button class="cb green" id="c-acc"></button></div>
    <div class="ctl c-out"><button class="cb mute" id="c-mute"></button><button class="cb red" id="c-end"></button></div>
  </div>
  <div id="lb"><img alt=""></div>
  <div id="toast"></div>
  <audio id="ra" autoplay></audio>
  <input type="file" id="f-photo" accept="image/*" class="hide">
  <input type="file" id="f-ava" accept="image/*" class="hide">
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',hang:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" transform="rotate(135 12 12)"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const h=(t,c,html)=>{const e=document.createElement(t);if(c)e.className=c;if(html!=null)e.innerHTML=html;return e};
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const tm=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let accs=JSON.parse(localStorage.accs||'[]'),cur=localStorage.cur,me,sock,cp,chats=new Map(),unread=new Map(),mode='login';
const saveA=()=>{localStorage.accs=JSON.stringify(accs);localStorage.cur=cur||''};
const tok=()=>(accs.find(a=>a.id===cur)||{}).token;
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok(),...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка');return j}
async function upload(blob,type){const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+tok(),'Content-Type':type},body:blob});const j=await r.json();if(!r.ok)throw new Error(j.error);return j.url}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function av(u,c=''){const d=h('div','av '+c);if(u.avatar){const i=new Image();i.src=u.avatar;i.alt='';d.appendChild(i)}else{d.textContent=(u.name||u.nick)[0].toUpperCase();d.style.background=`hsl(${[...u.nick].reduce((a,x)=>a+x.charCodeAt(0),0)*37%360} 55% 45%)`}return d}
function shrink(file,max){return new Promise((ok,no)=>{createImageBitmap(file).then(b=>{const k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);c.toBlob(x=>x?ok(x):no(),'image/jpeg',.85)}).catch(no)})}
const prev=m=>m.type==='text'?m.text:m.type==='image'?'📷 Фото':'🎤 Голосовое';

/* icons init */
$('#alogo').innerHTML=ic('chat');$('#n-chats').innerHTML=ic('chat');$('#n-prof').innerHTML=ic('user');
$('#back').innerHTML=ic('back');$('#callbtn').innerHTML=ic('phone');$('#photo').innerHTML=ic('img');
$('#rc').innerHTML=ic('x');$('#rs').innerHTML=ic('send');$('#c-dec').innerHTML=ic('hang');$('#c-acc').innerHTML=ic('phone');
$('#c-mute').innerHTML=ic('mic');$('#c-end').innerHTML=ic('hang');

/* auth */
function showAuth(canCancel){$('#auth').classList.remove('hide');$('#app').classList.add('hide');$('#a-cancel').classList.toggle('hide',!canCancel);setMode('login')}
function setMode(m){mode=m;const r=m==='register';$('#atitle').textContent=r?'Регистрация':'Вход';$('#a-name').classList.toggle('hide',!r);$('#a-go').textContent=r?'Создать аккаунт':'Войти';$('#a-sw').textContent=r?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация';$('#a-err').textContent=''}
$('#a-sw').onclick=()=>setMode(mode==='login'?'register':'login');
$('#a-cancel').onclick=()=>{$('#auth').classList.add('hide');$('#app').classList.remove('hide')};
$('#a-go').onclick=async()=>{
  try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nick:$('#a-nick').value,password:$('#a-pass').value,name:$('#a-name').value})});
  const j=await r.json();if(!r.ok)throw new Error(j.error);
  accs=accs.filter(a=>a.id!==j.user.id);accs.push({...j.user,token:j.token});cur=j.user.id;saveA();
  ['#a-nick','#a-pass','#a-name'].forEach(s=>$(s).value='');$('#auth').classList.add('hide');start()}catch(e){$('#a-err').textContent=e.message}};
$('#a-pass').onkeydown=e=>e.key==='Enter'&&$('#a-go').click();

/* start */
async function start(){
  if(sock){sock.disconnect();sock=null}
  try{me=await api('/api/me')}catch(e){
    if(e.message==='auth'){accs=accs.filter(a=>a.id!==cur);cur=accs[0]&&accs[0].id;saveA();return cur?start():showAuth(false)}
    return toast('Нет соединения')}
  const a=accs.find(x=>x.id===cur);Object.assign(a,me);saveA();
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  closeChat();chats.clear();unread.clear();$('#q').value='';connect();await loadChats();renderProfile();tab('chats');
  setTimeout(()=>$('#app').classList.remove('swap'),50);
}
function connect(){
  sock=io({auth:{token:tok()}});
  sock.on('msg',onMsg);
  sock.on('call:offer',d=>{if(pc||inc){sock.emit('call:end',{to:d.from});return}inc=d;cpeer=d.fromU;callUI(d.fromU,'Входящий звонок…','in');navigator.vibrate&&navigator.vibrate([300,200,300])});
  sock.on('call:answer',async d=>{if(!pc)return;await pc.setRemoteDescription(d.sdp);for(const c of pend)await pc.addIceCandidate(c);pend=[];$('#c-st').textContent='Соединение…'});
  sock.on('call:ice',async d=>{if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(d.c)}catch{}else pend.push(d.c)});
  sock.on('call:end',d=>{if(cpeer&&d.from===cpeer.id){toast('Звонок завершён');endCall(false)}});
}
async function loadChats(){const l=await api('/api/chats');chats=new Map(l.map(c=>[c.peer.id,c]));renderChats()}
function onMsg(m){
  const peer=m.from===me.id?m.toU:m.fromU;chats.set(peer.id,{peer,last:m});
  if(cp&&cp.id===peer.id)addMsg(m,true);
  else if(m.from!==me.id){unread.set(peer.id,(unread.get(peer.id)||0)+1);toast(peer.name+': '+prev(m).slice(0,40))}
  if(!$('#q').value.trim())renderChats();updBadge();
}
function updBadge(){const n=[...unread.values()].reduce((a,b)=>a+b,0);let b=$('#nbadge');if(!n){b&&b.remove();return}if(!b){b=h('span','badge');b.id='nbadge';$('#nav button').appendChild(b)}b.textContent=n}

/* tabs */
function tab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='tab-'+t));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#ind').style.transform=`translateX(${t==='chats'?0:100}%)`}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

/* list & search */
function rowFor(u,i,sub,right){const r=h('div','row');r.style.setProperty('--i',i);const m=h('div','mid');const b=h('b');b.textContent=u.name;const s=h('small');s.textContent=sub;m.append(b,s);r.append(av(u),m);if(right)r.append(right);r.onclick=()=>openChat(u);return r}
function renderChats(){
  const L=$('#list');L.innerHTML='';
  const arr=[...chats.values()].sort((a,b)=>b.last.ts-a.last.ts);
  if(!arr.length){L.append(h('div','empty','Пока нет чатов.<br>Найди друга по никнейму в поиске выше ☝️'));return}
  arr.forEach((c,i)=>{const r=h('div','r');r.append(h('span',null,tm(c.last.ts)));const n=unread.get(c.peer.id);if(n){const u=h('span','unr');u.textContent=n;r.append(u)}
    L.append(rowFor(c.peer,i,(c.last.from===me.id?'Вы: ':'')+prev(c.last),r))})
}
let sq=0,sdeb;
$('#q').oninput=()=>{clearTimeout(sdeb);sdeb=setTimeout(async()=>{const q=$('#q').value.trim(),k=++sq;if(!q)return renderChats();
  try{const l=await api('/api/search?q='+encodeURIComponent(q));if(k!==sq)return;const L=$('#list');L.innerHTML='';
  if(!l.length)L.append(h('div','empty','Никого не найдено'));l.forEach((u,i)=>L.append(rowFor(u,i,'@'+u.nick)))}catch{}},250)};

/* chat */
async function openChat(p){
  cp=p;unread.delete(p.id);updBadge();
  const u=$('#ch-user');u.innerHTML='';const t=h('div');t.innerHTML='<b></b><small></small>';t.firstChild.textContent=p.name;t.lastChild.textContent='@'+p.nick;u.append(av(p,'sm'),t);
  const M=$('#msgs');M.innerHTML='';$('#chat').classList.add('open');
  try{const l=await api('/api/messages/'+p.id);if(cp&&cp.id===p.id){l.forEach(m=>addMsg(m,false));M.scrollTop=M.scrollHeight}}catch{}
  if(!$('#q').value.trim())renderChats();
}
function closeChat(){cp=null;$('#chat').classList.remove('open');cancelRec();if(stopCur)stopCur()}
$('#back').onclick=()=>{closeChat();if($('#q').value.trim())$('#q').oninput()};
let stopCur;
function voiceEl(m){
  const w=h('div','voice'),b=h('button','pl',ic('play')),bar=h('div','bar','<i></i>'),t=h('span','dur',fmt(m.dur));w.append(b,bar,t);let a;
  b.onclick=()=>{
    if(a&&!a.paused){stopCur();return}
    if(stopCur)stopCur();
    if(!a){a=new Audio(m.url);a.ontimeupdate=()=>{bar.firstChild.style.width=Math.min(100,a.currentTime/(m.dur||a.duration||1)*100)+'%';t.textContent=fmt(a.currentTime)};
      a.onended=()=>{b.innerHTML=ic('play');bar.firstChild.style.width=0;t.textContent=fmt(m.dur)}}
    a.play();b.innerHTML=ic('pause');stopCur=()=>{a.pause();b.innerHTML=ic('play')}};
  return w}
function addMsg(m,anim){
  const M=$('#msgs'),mine=m.from===me.id,e=h('div','msg '+(mine?'me':'them')+(anim?' anim':''));
  if(m.type==='text'){e.append(document.createTextNode(m.text))}
  else if(m.type==='image'){e.classList.add('img');const i=new Image();i.src=m.url;i.onload=()=>M.scrollTop=M.scrollHeight;i.onclick=()=>{$('#lb img').src=m.url;$('#lb').classList.add('on')};e.append(i)}
  else e.append(voiceEl(m));
  e.append(h('time',null,tm(m.ts)));
  const down=M.scrollHeight-M.scrollTop-M.clientHeight<120||mine;M.append(e);if(down||!anim)M.scrollTop=M.scrollHeight}
$('#lb').onclick=()=>$('#lb').classList.remove('on');
const send=d=>sock.emit('msg',{to:cp.id,...d});
function mode2(){const has=$('#txt').value.trim();$('#sb').innerHTML=ic(has?'send':'mic');$('#sb').dataset.m=has?'s':'m'}
$('#txt').oninput=mode2;mode2();
$('#txt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}};
function doSend(){const t=$('#txt').value.trim();if(!t)return;send({type:'text',text:t});$('#txt').value='';mode2()}
$('#sb').onclick=()=>$('#sb').dataset.m==='s'?doSend():startRec();
$('#photo').onclick=()=>$('#f-photo').click();
$('#f-photo').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cp)return;
  try{const url=await upload(await shrink(f,1600),'image/jpeg');send({type:'image',url})}catch{toast('Не удалось отправить фото')}};

/* voice recording */
let rec,chunks,t0,rtick,rcancel;
async function startRec(){
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  const to=cp;rec=new MediaRecorder(s,mt?{mimeType:mt}:{});chunks=[];rcancel=false;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());clearInterval(rtick);$('#recbar').classList.add('hide');$('#inp').classList.remove('hide');if(rcancel)return;
    const dur=Math.round((Date.now()-t0)/1000);if(dur<1)return;
    try{const type=(rec.mimeType||mt||'audio/webm');const url=await upload(new Blob(chunks,{type}),type);if(cp&&to&&cp.id===to.id)send({type:'voice',url,dur})}catch{toast('Не удалось отправить голосовое')}};
  rec.start();t0=Date.now();$('#rt').textContent='0:00';rtick=setInterval(()=>$('#rt').textContent=fmt((Date.now()-t0)/1000),250);
  $('#inp').classList.add('hide');$('#recbar').classList.remove('hide')}catch{toast('Нет доступа к микрофону')}}
function cancelRec(){if(rec&&rec.state==='recording'){rcancel=true;rec.stop()}}
$('#rc').onclick=cancelRec;$('#rs').onclick=()=>rec&&rec.state==='recording'&&rec.stop();

/* profile */
function renderProfile(){
  const T=$('#tab-profile');T.innerHTML='';const p=h('div','prof');
  const w=h('div','avw');w.append(av(me,'xl'));w.append(h('div','cam',ic('cam')));w.onclick=()=>$('#f-ava').click();
  const nm=h('div');nm.style.textAlign='center';nm.innerHTML='<b style="font-size:22px"></b><div style="color:var(--mut)"></div>';nm.firstChild.textContent=me.name;nm.lastChild.textContent='@'+me.nick;
  const f=h('input','fld');f.value=me.name;f.maxLength=30;f.placeholder='Имя';
  const sv=h('button','btn sec');sv.textContent='Сохранить имя';
  sv.onclick=async()=>{try{me=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:f.value})});Object.assign(accs.find(a=>a.id===cur),me);saveA();renderProfile();toast('Сохранено')}catch(e){toast(e.message)}};
  const box=h('div','accs');box.append(h('h4',null,'Аккаунты'));
  accs.forEach((a,i)=>{const r=rowFor(a,i,'@'+a.nick,a.id===cur?h('span','chk','✓'):null);r.onclick=()=>a.id!==cur&&switchAcc(a.id);box.append(r)});
  const add=h('button','btn');add.textContent='+ Добавить аккаунт';add.onclick=()=>{$('#auth').classList.remove('hide');$('#a-cancel').classList.remove('hide');setMode('login')};
  const out=h('button','btn red');out.textContent='Выйти из аккаунта';
  out.onclick=()=>{accs=accs.filter(a=>a.id!==cur);cur=accs[0]&&accs[0].id;saveA();if(cur)switchAcc(cur);else{if(sock)sock.disconnect();showAuth(false)}};
  p.append(w,nm,f,sv,box,add,out);T.append(p);return w}
function switchAcc(id){cur=id;saveA();$('#app').classList.add('swap');setTimeout(start,250)}
$('#f-ava').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const url=await upload(await shrink(f,512),'image/jpeg');me=await api('/api/profile',{method:'PUT',body:JSON.stringify({avatar:url})});
  Object.assign(accs.find(a=>a.id===cur),me);saveA();renderProfile().firstChild.classList.add('bump');toast('Аватар обновлён')}catch{toast('Не удалось загрузить фото')}};

/* calls (WebRTC) */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let pc,ls,cpeer,ctimer,cto,pend=[],inc,muted=false;
function callUI(p,st,m){const c=$('#call');c.classList.add('on');c.classList.remove('live');c.dataset.mode=m;$('#c-av').replaceChildren(av(p,'xl'));$('#c-name').textContent=p.name;$('#c-st').textContent=st;muted=false;$('#c-mute').classList.remove('on')}
function mkPC(to){const p=new RTCPeerConnection(ICE);
  p.onicecandidate=e=>e.candidate&&sock.emit('call:ice',{to,c:e.candidate});
  p.ontrack=e=>{$('#ra').srcObject=e.streams[0];$('#ra').play().catch(()=>{})};
  p.onconnectionstatechange=()=>{const s=p.connectionState;if(s==='connected'){clearTimeout(cto);$('#call').classList.add('live');if(!ctimer){const t=Date.now();ctimer=setInterval(()=>$('#c-st').textContent=fmt((Date.now()-t)/1000),500)}}else if(s==='failed'){toast('Не удалось соединиться');endCall(true)}};
  return p}
async function mic(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch{toast('Нет доступа к микрофону');return null}}
async function startCall(p){
  if(pc||inc)return;ls=await mic();if(!ls)return;cpeer=p;callUI(p,'Вызов…','out');
  pc=mkPC(p.id);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('call:offer',{to:p.id,sdp:o});
  cto=setTimeout(()=>{toast('Нет ответа');endCall(true)},45000)}
async function acceptCall(){
  const i=inc;inc=null;ls=await mic();if(!ls){sock.emit('call:end',{to:i.from});return endCall(false)}
  pc=mkPC(i.from);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  await pc.setRemoteDescription(i.sdp);for(const c of pend)await pc.addIceCandidate(c);pend=[];
  const a=await pc.createAnswer();await pc.setLocalDescription(a);sock.emit('call:answer',{to:i.from,sdp:a});
  $('#call').dataset.mode='out';$('#c-st').textContent='Соединение…'}
function endCall(notify){
  if(notify&&cpeer&&sock)sock.emit('call:end',{to:cpeer.id});
  if(pc)pc.close();pc=null;if(ls)ls.getTracks().forEach(t=>t.stop());ls=null;
  clearInterval(ctimer);ctimer=null;clearTimeout(cto);pend=[];inc=null;cpeer=null;$('#ra').srcObject=null;$('#call').classList.remove('on')}
$('#callbtn').onclick=()=>cp&&startCall(cp);
$('#c-acc').onclick=acceptCall;
$('#c-dec').onclick=()=>endCall(true);$('#c-end').onclick=()=>endCall(true);
$('#c-mute').onclick=()=>{muted=!muted;if(ls)ls.getAudioTracks().forEach(t=>t.enabled=!muted);$('#c-mute').classList.toggle('on',muted)};

/* boot */
if(cur&&accs.find(a=>a.id===cur))start();else if(accs.length){cur=accs[0].id;start()}else showAuth(false);
</script>
