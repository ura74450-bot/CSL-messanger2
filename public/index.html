<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Мессенджер</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--acc:#7c5cff;--acc2:#3ecbff;--txt:#eef1f6;--mut:#8b94a5;--g:linear-gradient(135deg,#7c5cff,#3ecbff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100dvh;background:#07090d;color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;overflow:hidden}
#root{position:relative;width:100%;max-width:480px;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:500px){body{align-items:center}#root{height:min(900px,96dvh);border-radius:28px;box-shadow:0 30px 80px #000a;border:1px solid #ffffff12}}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--txt);outline:0}
svg{width:24px;height:24px;display:block}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden;color:#fff;background:var(--card2)}
.av img{width:100%;height:100%;object-fit:cover;animation:fade .4s}
.av.sm{width:40px;height:40px;font-size:16px}.av.xl{width:112px;height:112px;font-size:44px}
.fld{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ffffff14;background:var(--card);transition:.2s}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 3px #7c5cff30}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--g);font-weight:600;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--card2)}.btn.red{background:#3a1d24;color:#ff6b7d}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.85)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bump{40%{transform:scale(1.18) rotate(4deg)}}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(2.2);opacity:0}}
@keyframes blink{50%{opacity:.2}}
/* auth */
#auth{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px;background:radial-gradient(circle at 20% 0,#7c5cff40,transparent 50%),radial-gradient(circle at 90% 100%,#3ecbff30,transparent 50%),var(--bg);animation:fade .4s}
#auth>*{animation:up .5s backwards}#auth>:nth-child(2){animation-delay:.05s}#auth>:nth-child(3){animation-delay:.1s}#auth>:nth-child(4){animation-delay:.15s}#auth>:nth-child(5){animation-delay:.2s}#auth>:nth-child(6){animation-delay:.25s}
.logo{width:84px;height:84px;border-radius:26px;background:var(--g);display:grid;place-items:center;margin:0 auto;animation:float 3.5s infinite ease-in-out!important;box-shadow:0 14px 40px #7c5cff55}
.logo svg{width:44px;height:44px;stroke:#fff}
#auth h1{margin:6px 0 0;text-align:center;font-size:26px}
.pw{position:relative}.pw .fld{padding-right:52px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:color .2s,background .2s}.eye:active{background:#ffffff12}.eye.on{color:var(--acc2)}.eye svg{animation:pop .25s}
.link{color:var(--acc2);text-align:center;padding:8px}.err{color:#ff6b7d;text-align:center;min-height:20px}
/* tabs & nav */
.tab{position:absolute;inset:0 0 calc(64px + env(safe-area-inset-bottom)) 0;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s}
.tab.on{opacity:1;pointer-events:auto;transform:none}
#app.swap .tab{opacity:0;transform:scale(.97)}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#12161dd9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #ffffff10;z-index:5}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);transition:color .25s}
#nav button svg{transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
#nav button.on{color:#fff}#nav button.on svg{transform:translateY(-2px) scale(1.18);stroke:var(--acc2)}
#ind{position:absolute;top:0;left:0;width:50%;height:3px;display:flex;justify-content:center;transition:transform .4s cubic-bezier(.4,1.4,.5,1)}
#ind i{width:44px;height:3px;border-radius:0 0 4px 4px;background:var(--g)}
.badge{position:absolute;margin:-26px -26px 0 0;min-width:18px;height:18px;border-radius:9px;background:#ff4d6a;font-size:11px;display:grid;place-items:center;padding:0 5px}
/* chats list */
.top{padding:18px 18px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:2}
.top h2{margin:0 0 12px;font-size:28px}
.row{display:flex;gap:12px;align-items:center;padding:10px 18px;cursor:pointer;transition:background .2s;animation:up .45s backwards;animation-delay:calc(var(--i,0)*45ms)}
.row:active,.row:hover{background:#ffffff08}
.row .mid{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.unr{background:var(--g);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;animation:pop .3s}
.empty{text-align:center;color:var(--mut);padding:60px 30px;animation:up .5s}
/* chat */
#chat{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .4s cubic-bezier(.3,.9,.3,1)}
#chat.open{transform:none}
.ch-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#12161d;border-bottom:1px solid #ffffff10}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:.2s}.ib:active{transform:scale(.88);background:#ffffff12}
#ch-user{flex:1;display:flex;align-items:center;gap:10px;min-width:0}#ch-user b{display:block}#ch-user small{color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 80% 0,#7c5cff14,transparent 50%)}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;word-break:break-word;white-space:pre-wrap;position:relative}
.msg.anim{animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.msg.me{align-self:flex-end;background:var(--g);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;text-align:right;margin-top:2px}
.msg.img{padding:4px}.msg.img img{display:block;max-width:100%;width:240px;border-radius:14px;cursor:zoom-in;animation:fade .5s}
.msg.img time{position:absolute;right:10px;bottom:8px;background:#0008;padding:1px 6px;border-radius:8px;margin:0}
.voice{display:flex;align-items:center;gap:10px;min-width:190px}
.pl{width:38px;height:38px;border-radius:50%;background:#fff3;display:grid;place-items:center;flex:none;transition:transform .15s}.pl:active{transform:scale(.88)}.pl svg{width:18px;height:18px}
.bar{flex:1;height:5px;border-radius:3px;background:#fff3;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s linear}
.dur{font-size:12px;min-width:34px}
.inp{display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#12161d;border-top:1px solid #ffffff10}
.inp input[type=text]{flex:1;padding:12px 16px;border-radius:22px;border:0;background:var(--card2)}
#sb{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;transition:transform .15s}#sb:active{transform:scale(.88)}
#sb svg{animation:pop .3s;width:22px;height:22px}
.rec{flex:1;display:flex;align-items:center;gap:10px;padding-left:10px;animation:up .25s}
.rec i{width:12px;height:12px;border-radius:50%;background:#ff4d6a;animation:blink 1s infinite}
/* profile */
.prof{padding:30px 22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.prof>*{animation:up .5s backwards}.prof>:nth-child(2){animation-delay:.06s}.prof>:nth-child(3){animation-delay:.12s}.prof>:nth-child(4){animation-delay:.18s}
.avw{position:relative;cursor:pointer}.avw .cam{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;background:var(--g);display:grid;place-items:center;border:3px solid var(--bg)}.cam svg{width:18px;height:18px}
.bump{animation:bump .6s}
.accs{width:100%;background:var(--card);border-radius:18px;padding:6px 0;margin-top:6px}
.accs h4{margin:10px 18px 4px;color:var(--mut);font-weight:500}
.chk{color:var(--acc2);font-weight:700}
/* call */
#call{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:90px 20px 70px;background:radial-gradient(circle at 50% 30%,#4a35b8,#0e1116 70%);opacity:0;pointer-events:none;transform:scale(1.08);transition:.35s}
#call.on{opacity:1;pointer-events:auto;transform:none}
.cav{position:relative;margin:0 auto}.cav::before,.cav::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc2);animation:ring 2s infinite}.cav::after{animation-delay:1s}
#call.live .cav::before,#call.live .cav::after{animation-play-state:paused;opacity:0}
#call h2{margin:22px 0 4px;text-align:center}#c-st{text-align:center;color:#ffffffaa}
.ctl{display:flex;gap:30px}.cb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;transition:.2s}.cb:active{transform:scale(.88)}
.cb.red{background:#ff4d6a}.cb.green{background:#2fd26f;animation:float 1.4s infinite}.cb.mute.on{background:#fff;color:#111}
#call[data-mode=in] .c-out,#call[data-mode=out] .c-in{display:none}
#lb{position:absolute;inset:0;z-index:50;background:#000e;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.3s}#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:96%;max-height:90%;border-radius:12px;transform:scale(.9);transition:.35s}#lb.on img{transform:none}
#toast{position:absolute;left:50%;top:16px;z-index:60;transform:translate(-50%,-80px);background:#232a36;padding:10px 18px;border-radius:16px;box-shadow:0 8px 30px #0008;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}

.th{display:flex;align-items:center;justify-content:space-between}
.plus{background:var(--g);margin-bottom:12px;box-shadow:0 6px 18px #7c5cff55}.plus svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.plus:hover svg{transform:rotate(90deg)}.plus:active{transform:scale(.85)}
#msgs{overflow-x:hidden}
.msg{touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,max-height .3s,opacity .3s}
.msg.hl{transform:scale(1.04);box-shadow:0 10px 30px #0008}
.sn{font-size:13px;font-weight:600;margin-bottom:2px}
.fw{font-size:12px;opacity:.85;font-style:italic;margin-bottom:3px}
.rq{border-left:3px solid #fffd;background:#00000026;border-radius:6px;padding:3px 8px;margin:0 0 5px;cursor:pointer;font-size:13px}
.rq b{display:block;font-size:12px}.rq span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.msg.them .rq{border-color:var(--acc2)}
.swi{position:absolute;left:100%;top:50%;margin-left:14px;width:34px;height:34px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;opacity:0;transform:translateY(-50%) scale(.4);pointer-events:none}.swi svg{width:18px;height:18px}
.msg.flash{animation:flash 1.2s}@keyframes flash{30%{filter:brightness(1.7);transform:scale(1.04)}}
.msg.sel{box-shadow:0 0 0 2px var(--acc2)}
.msg.sel::after{content:"✓";position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--acc2);color:#06222c;font-size:13px;font-weight:700;display:grid;place-items:center;animation:pop .25s}
.msg.out{opacity:0;transform:scale(.6)!important;max-height:0!important;padding-top:0;padding-bottom:0;margin:-3px 0;overflow:hidden}
.file{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;min-width:180px}
.file>svg{width:40px;height:40px;padding:8px;border-radius:50%;background:#ffffff33;flex:none}.file b{display:block;word-break:break-all;font-weight:600}.file small{opacity:.75}
.rbar{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;background:#12161d;border-top:1px solid #ffffff10;animation:up .25s}
.rbar .rl{width:3px;align-self:stretch;border-radius:2px;background:var(--g)}.rt2{flex:1;min-width:0}.rbar b{display:block;color:var(--acc2);font-size:13px}.rbar span{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ro{padding:16px;text-align:center;color:var(--mut);background:#12161d;border-top:1px solid #ffffff10}
.sel-h{position:absolute;left:0;right:0;top:0;z-index:3;animation:down .25s}.sel-h span{flex:1;font-weight:600;font-size:17px;padding-left:8px}
@keyframes down{from{transform:translateY(-100%)}}
.pmb{position:absolute;inset:0;z-index:19;background:#0000004d;animation:fade .2s}
.pm{position:absolute;z-index:20;background:#232a36f2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:6px;box-shadow:0 14px 40px #000a;animation:menuIn .28s cubic-bezier(.3,1.5,.5,1)}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;text-align:left;animation:up .25s backwards;transition:background .15s}
.pi:hover,.pi:active{background:#ffffff14}.pi svg{width:20px;height:20px;color:var(--mut)}.pi.red,.pi.red svg{color:#ff6b7d}
@keyframes menuIn{from{opacity:0;transform:scale(.5)}}
.pm.bye,.pmb.bye{animation:byeA .16s forwards}@keyframes byeA{to{opacity:0;transform:scale(.9)}}
.sw{position:absolute;inset:0;z-index:35;background:#0009;display:flex;align-items:flex-end;animation:fade .25s}
.sp{width:100%;max-height:88%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sheetUp .4s cubic-bezier(.3,1.1,.4,1);border-top:1px solid #ffffff14}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sw.bye{animation:fadeOut .25s forwards}.sw.bye .sp{transform:translateY(100%);transition:transform .25s}@keyframes fadeOut{to{opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px 20px;font-size:17px}
.sb2{padding:8px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sb2 .avw{align-self:center}.sb2 .row{padding-left:4px;padding-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:16px;padding:3px 10px 3px 3px;animation:pop .25s;cursor:pointer}
.av.xs{width:24px;height:24px;font-size:12px}.pk{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div id="root">
  <div id="auth" class="hide">
    <div class="logo" id="alogo"></div>
    <h1 id="atitle">Вход</h1>
    <input class="fld" id="a-name" placeholder="Имя" maxlength="30">
    <input class="fld" id="a-nick" placeholder="Никнейм" autocapitalize="off" autocomplete="username">
    <div class="pw"><input class="fld" id="a-pass" type="password" placeholder="Пароль" autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Показать пароль"></button></div>
    <div class="err" id="a-err"></div>
    <button class="btn" id="a-go">Войти</button>
    <button class="link" id="a-sw">Нет аккаунта? Регистрация</button>
    <button class="link hide" id="a-cancel">Отмена</button>
  </div>

  <div id="app" class="hide">
    <section class="tab on" id="tab-chats">
      <div class="top"><div class="th"><h2>Чаты</h2><button class="ib plus" id="plus"></button></div><input class="fld" id="q" placeholder="Поиск по никнейму…" autocapitalize="off"></div>
      <div id="list"></div>
    </section>
    <section class="tab" id="tab-profile"></section>
    <nav id="nav">
      <div id="ind"><i></i></div>
      <button data-t="chats" class="on"><span id="n-chats"></span>Чаты</button>
      <button data-t="profile"><span id="n-prof"></span>Профиль</button>
    </nav>
    <section id="chat">
      <div class="ch-h">
        <button class="ib" id="back"></button>
        <div id="ch-user"></div>
        <button class="ib" id="callbtn"></button>
      </div>
      <div class="ch-h sel-h hide" id="sel-h"><button class="ib" id="sx"></button><span id="sc">0</span><button class="ib" id="scp"></button><button class="ib" id="sfw"></button><button class="ib" id="sdl"></button></div>
      <div id="msgs"></div>
      <div class="rbar hide" id="rbar"><div class="rl"></div><div class="rt2"><b></b><span></span></div><button class="ib" id="rx"></button></div>
      <div class="ro hide" id="ro">Писать в канал может только владелец</div>
      <div class="inp" id="inp">
        <button class="ib" id="photo"></button>
        <input type="text" id="txt" placeholder="Сообщение" autocomplete="off">
        <button id="sb"></button>
      </div>
      <div class="inp hide" id="recbar">
        <button class="ib" id="rc"></button>
        <div class="rec"><i></i><span id="rt">0:00</span></div>
        <button id="rs" class="ib" style="background:var(--g)"></button>
      </div>
    </section>
  </div>

  <div id="call" data-mode="out">
    <div><div class="cav" id="c-av"></div><h2 id="c-name"></h2><div id="c-st"></div></div>
    <div class="ctl c-in"><button class="cb red" id="c-dec"></button><button class="cb green" id="c-acc"></button></div>
    <div class="ctl c-out"><button class="cb mute" id="c-mute"></button><button class="cb red" id="c-end"></button></div>
  </div>
  <div id="lb"><img alt=""></div>
  <div id="toast"></div>
  <audio id="ra" autoplay></audio>
  <input type="file" id="f-photo" accept="image/*" class="hide">
  <input type="file" id="f-ava" accept="image/*" class="hide">
  <input type="file" id="f-file" class="hide">
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s);
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',hang:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" transform="rotate(135 12 12)"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',back:'<path d="M15 5l-7 7 7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>'};

/* start */
async function start(){
  if(sock){sock.disconnect();sock=null}
  try{me=await api('/api/me')}catch(e){
    if(e.message==='auth'){accs=accs.filter(a=>a.id!==cur);cur=accs[0]&&accs[0].id;saveA();return cur?start():showAuth(false)}
    return toast('Нет соединения')}
  const a=accs.find(x=>x.id===cur);Object.assign(a,me);saveA();
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  closeChat();chats.clear();unread.clear();mm.clear();$('#list').innerHTML='';$('#msgs').innerHTML='';$('#q').value='';connect();await loadChats();renderProfile();tab('chats');
  setTimeout(()=>$('#app').classList.remove('swap'),50);
}
function connect(){
  sock=io({auth:{token:tok()}});
  sock.on('msg',onMsg);sock.on('group',addGroup);sock.on('group:gone',d=>gone(d.id));sock.on('del',onDel);
  sock.on('call:offer',d=>{if(pc||inc){sock.emit('call:end',{to:d.from});return}inc=d;cpeer=d.fromU;callUI(d.fromU,'Входящий звонок…','in');navigator.vibrate&&navigator.vibrate([300,200,300])});
  sock.on('call:answer',async d=>{if(!pc)return;await pc.setRemoteDescription(d.sdp);for(const c of pend)await pc.addIceCandidate(c);pend=[];$('#c-st').textContent='Соединение…'});
  sock.on('call:ice',async d=>{if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(d.c)}catch{}else pend.push(d.c)});
  sock.on('call:end',d=>{if(cpeer&&d.from===cpeer.id){toast('Звонок завершён');endCall(false)}});
}
const ent=c=>c.peer||c.group;
const keyOf=c=>c.peer?'u:'+c.peer.id:'g:'+c.group.id;
const curKey=()=>cp?(cp.type?'g:':'u:')+cp.id:null;
const isRO=g=>!!(g&&g.type==='channel'&&g.owner!==me.id);
const tsOf=c=>c.last?c.last.ts:(c.group?c.group.created:0);
const mm=new Map();
async function loadChats(){const l=await api('/api/chats');chats=new Map(l.map(c=>[keyOf(c),c]));renderChats()}
function addGroup(g){const k='g:'+g.id,ex=chats.get(k);chats.set(k,{group:g,last:ex?ex.last:null});if(cp&&cp.id===g.id){cp=g;setHead()}if(!$('#q').value.trim())renderChats()}
function gone(id){chats.delete('g:'+id);if(cp&&cp.id===id)closeChat();if(!$('#q').value.trim())renderChats()}
function onMsg(m){
  const key=m.chat?'g:'+m.chat:'u:'+(m.from===me.id?m.to:m.from),ex=chats.get(key);
  if(m.chat){if(!ex)return loadChats();ex.last=m}else chats.set(key,{peer:m.from===me.id?m.toU:m.fromU,last:m});
  if(cp&&curKey()===key)addMsg(m,true);
  else if(m.from!==me.id){unread.set(key,(unread.get(key)||0)+1);toast(ent(chats.get(key)).name+': '+(m.chat?m.fn+': ':'')+prev(m).slice(0,40))}
  if(!$('#q').value.trim())renderChats();updBadge();
}
function updBadge(){const n=[...unread.values()].reduce((a,b)=>a+b,0);let b=$('#nbadge');if(!n){b&&b.remove();return}if(!b){b=h('span','badge');b.id='nbadge';$('#nav button').appendChild(b)}b.textContent=n}

function renderChats(){
  const L=$('#list');L.innerHTML='';
  const arr=[...chats.values()].sort((a,b)=>tsOf(b)-tsOf(a));
  if(!arr.length){L.append(h('div','empty','Пока нет чатов.<br>Найди друга по нику или нажми ＋ чтобы создать группу или канал'));return}
  arr.forEach((c,i)=>{const e=ent(c),l=c.last,r=h('div','r');if(l)r.append(h('span',null,tm(l.ts)));const n=unread.get(keyOf(c));if(n){const u=h('span','unr');u.textContent=n;r.append(u)}
    const sub=l?((l.from===me.id?'Вы: ':(c.group?(l.fn||'')+': ':''))+prev(l)):(c.group.type==='channel'?'Канал':'Группа');
    L.append(rowFor(e,i,sub,r))})
}

async function openChat(p){
  cp=p;const key=curKey();unread.delete(key);updBadge();endSel();clearReply();mm.clear();setHead();
  $('#callbtn').classList.toggle('hide',!!p.type);const ro=isRO(p);$('#inp').classList.toggle('hide',ro);$('#ro').classList.toggle('hide',!ro);
  const M=$('#msgs');M.innerHTML='';$('#chat').classList.add('open');
  try{const l=await api('/api/messages/'+key);if(cp&&curKey()===key){l.forEach(m=>addMsg(m,false));M.scrollTop=M.scrollHeight}}catch{}
  if(!$('#q').value.trim())renderChats();
}
function setHead(){const u=$('#ch-user');u.innerHTML='';const t=h('div');t.innerHTML='<b></b><small></small>';t.firstChild.textContent=cp.name;
  t.lastChild.textContent=cp.type?cp.members.length+(cp.type==='channel'?' подписчиков':' участников'):'@'+cp.nick;u.append(av(cp,'sm'),t);u.style.cursor=cp.type?'pointer':'default'}

function voiceEl(m){
  const w=h('div','voice'),b=h('button','pl',ic('play')),bar=h('div','bar','<i></i>'),t=h('span','dur',fmt(m.dur));w.append(b,bar,t);let a;
  b.onclick=()=>{
    if(a&&!a.paused){stopCur();return}
    if(stopCur)stopCur();
    if(!a){a=new Audio(m.url);a.ontimeupdate=()=>{bar.firstChild.style.width=Math.min(100,a.currentTime/(m.dur||a.duration||1)*100)+'%';t.textContent=fmt(a.currentTime)};
      a.onended=()=>{b.innerHTML=ic('play');bar.firstChild.style.width=0;t.textContent=fmt(m.dur)}}

function jump(id){const e=document.querySelector(`.msg[data-id="${id}"]`);if(!e)return toast('Сообщение не найдено');e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}
function addMsg(m,anim){
  mm.set(m.id,m);
  const M=$('#msgs'),mine=m.from===me.id,e=h('div','msg '+(mine?'me':'them')+(anim?' anim':''));e.dataset.id=m.id;
  if(cp.type==='group'&&!mine){const n=h('div','sn');n.textContent=m.fn||'';n.style.color=`hsl(${[...(m.fn||'?')].reduce((a,x)=>a+x.charCodeAt(0),0)*37%360} 75% 75%)`;e.append(n)}
  if(m.fwd){const f=h('div','fw');f.textContent='Переслано от '+m.fwd;e.append(f)}
  if(m.reply){const q=h('div','rq','<b></b><span></span>');q.firstChild.textContent=m.reply.name||'';q.lastChild.textContent=m.reply.prev||'';q.onclick=()=>jump(m.reply.id);e.append(q)}
  if(m.type==='text')e.append(document.createTextNode(m.text));
  else if(m.type==='image'){e.classList.add('img');const i=new Image();i.src=m.url;i.onload=()=>{if(!anim)return;M.scrollTop=M.scrollHeight};i.onclick=()=>{if(selecting)return;$('#lb img').src=m.url;$('#lb').classList.add('on')};e.append(i)}
  else if(m.type==='file'){const f=h('a','file',ic('file')+'<div><b></b><small></small></div>');f.href=m.url;f.download=m.name||'';f.target='_blank';f.querySelector('b').textContent=m.name;f.querySelector('small').textContent=sz(m.size);e.append(f)}
  else e.append(voiceEl(m));
  e.append(h('time',null,tm(m.ts)));
  const ind=h('div','swi',ic('reply'));e.append(ind);
  let sx=0,dx=0,dn=false,mv=false;
  e.addEventListener('pointerdown',ev=>{if(ev.button>0)return;sx=ev.clientX;dx=0;dn=true;mv=false;e.style.transition='none'});
  e.addEventListener('pointermove',ev=>{if(!dn)return;dx=ev.clientX-sx;if(Math.abs(dx)>8)mv=true;
    if(dx<0&&!isRO(cp)){const t=Math.max(dx,-90),k=Math.min(1,-t/55);e.style.transform=`translateX(${t}px)`;ind.style.opacity=k;ind.style.transform=`translateY(-50%) scale(${.4+.6*k})`}});
  const up=()=>{if(!dn)return;dn=false;e.style.transition='';e.style.transform='';ind.style.opacity=0;ind.style.transform='';if(dx<-55&&!isRO(cp)){if(navigator.vibrate)navigator.vibrate(10);setReply(m)}};
  ['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,up));
  e.addEventListener('click',ev=>{if(mv){mv=false;return}if(selecting){ev.preventDefault();toggleSel(m.id);return}if(ev.target.closest('.pl,a,.rq')||ev.target.tagName==='IMG')return;openMenu(e,m)});
  e.addEventListener('contextmenu',ev=>{ev.preventDefault();if(!selecting)openMenu(e,m)});
  const down=M.scrollHeight-M.scrollTop-M.clientHeight<140||mine;M.append(e);if(down||!anim)M.scrollTop=M.scrollHeight}

function clearReply(){replyTo=null;$('#rbar').classList.add('hide')}
$('#rx').onclick=clearReply;
function onDel(d){d.ids.forEach(id=>{mm.delete(id);sel.delete(id);const e=document.querySelector(`.msg[data-id="${id}"]`);if(e){e.style.maxHeight=e.offsetHeight+'px';void e.offsetWidth;e.classList.add('out');setTimeout(()=>e.remove(),320)}});if(selecting&&!sel.size)endSel();loadChats()}
function confirmDel(ids){
  const ms=ids.map(i=>mm.get(i)).filter(Boolean);if(!ms.length)return;
  const all=ms.every(m=>m.from===me.id||(cp.type&&cp.owner===me.id));
  sheet(ids.length>1?'Удалить '+ids.length+' сообщ.?':'Удалить сообщение?',(b,close)=>{
    const mk=(t,cls,a)=>{const x=h('button','btn '+cls);x.textContent=t;x.onclick=()=>{sock.emit('del',{ids,all:a});close();endSel()};b.append(x)};
    if(all)mk(cp.type?'Удалить у всех':'Удалить у меня и у '+cp.name,'red',true);
    mk('Удалить только у меня','sec',false);
    const c=h('button','btn sec');c.textContent='Отмена';c.onclick=close;b.append(c)})}
function forward(ids){
  const ms=ids.map(i=>mm.get(i)).filter(Boolean).sort((a,b)=>a.ts-b.ts);
  sheet('Переслать',(b,close)=>{const L=h('div');const arr=[...chats.values()].filter(c=>!isRO(c.group));
    if(!arr.length)L.append(h('div','empty','Нет чатов для пересылки'));
    arr.forEach((c,i)=>{const e=ent(c),r=rowFor(e,i,c.group?(c.group.type==='channel'?'Канал':'Группа'):'@'+e.nick);
      r.onclick=()=>{ms.forEach(m=>sock.emit('msg',{...(e.type?{chat:e.id}:{to:e.id}),type:m.type,text:m.text,url:m.url,name:m.name,size:m.size,dur:m.dur,fwd:m.fwd||(m.from===me.id?me.name:m.fn)}));close();endSel();toast('Переслано в «'+e.name+'»')};L.append(r)});
    b.append(L)})}

/* input */
const send=d=>{if(!cp)return;sock.emit('msg',{...(cp.type?{chat:cp.id}:{to:cp.id}),...d,reply:replyTo?replyTo.id:undefined});clearReply()};
function mode2(){const has=$('#txt').value.trim();$('#sb').innerHTML=ic(has?'send':'mic');$('#sb').dataset.m=has?'s':'m'}
$('#txt').oninput=mode2;mode2();
$('#txt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}};
function doSend(){const t=$('#txt').value.trim();if(!t)return;send({type:'text',text:t});$('#txt').value='';mode2()}
$('#sb').onclick=()=>$('#sb').dataset.m==='s'?doSend():startRec();
$('#photo').onclick=()=>popMenu($('#photo'),[{t:'Фото',i:'img',fn:()=>$('#f-photo').click()},{t:'Файл',i:'file',fn:()=>$('#f-file').click()}],'left');
$('#f-photo').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cp)return;
  try{const url=await upload(await shrink(f,1600),'image/jpeg');send({type:'image',url})}catch{toast('Не удалось отправить фото')}};
$('#f-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cp)return;if(f.size>25e6)return toast('Файл больше 25 МБ');toast('Загрузка файла…');
  try{const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/octet-stream','X-Kind':'file','X-Filename':encodeURIComponent(f.name)},body:f});const j=await r.json();if(!r.ok)throw 0;send({type:'file',url:j.url,name:f.name,size:f.size})}catch{toast('Не удалось отправить файл')}};

/* groups & channels */
$('#plus').onclick=()=>popMenu($('#plus'),[{t:'Новая группа',i:'users',fn:()=>newChat('group')},{t:'Новый канал',i:'mega',fn:()=>newChat('channel')}],'right');
function picker(ex){
  const sel=new Map(),el=h('div','pk'),chips=h('div','chips'),inp=h('input','fld'),res=h('div');inp.placeholder='Добавить людей по никнейму…';inp.autocapitalize='off';el.append(chips,inp,res);
  const draw=()=>chips.replaceChildren(...[...sel.values()].map(u=>{const c=h('span','chip');c.append(av(u,'xs'),document.createTextNode(u.name));c.onclick=()=>{sel.delete(u.id);draw();inp.oninput()};return c}));
  let k=0,d;inp.oninput=()=>{clearTimeout(d);d=setTimeout(async()=>{const q=inp.value.trim(),n=++k;if(!q){res.innerHTML='';return}
    try{const l=(await api('/api/search?q='+encodeURIComponent(q))).filter(u=>!ex.includes(u.id));if(n!==k)return;res.innerHTML='';
    l.forEach((u,i)=>{const r=rowFor(u,i,'@'+u.nick,sel.has(u.id)?h('span','chk','✓'):null);r.onclick=()=>{sel.has(u.id)?sel.delete(u.id):sel.set(u.id,u);draw();inp.oninput()};res.append(r)})}catch{}},200)};
  return{el,sel}}
function newChat(type){
  sheet(type==='channel'?'Новый канал':'Новая группа',(b,close)=>{
    let url=null;const ti=h('input','fld'),pic=h('div','avw'),fi=document.createElement('input');ti.placeholder=type==='channel'?'Название канала':'Название группы';ti.maxLength=40;fi.type='file';fi.accept='image/*';
    const draw=()=>pic.replaceChildren(av({name:ti.value||'?',nick:ti.value||'x',avatar:url},'xl'),h('div','cam',ic('cam')));draw();
    pic.onclick=()=>fi.click();ti.oninput=()=>{if(!url)draw()};
    fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{url=await upload(await shrink(f,512),'image/jpeg');draw();pic.firstChild.classList.add('bump')}catch{toast('Не удалось загрузить фото')}};
    const pk=picker([]),go=h('button','btn');go.textContent='Создать';
    go.onclick=async()=>{if(!ti.value.trim())return toast('Введите название');
      try{const g=await api('/api/groups',{method:'POST',body:JSON.stringify({type,title:ti.value,avatar:url,members:[...pk.sel.keys()]})});close();addGroup(g);openChat(chats.get('g:'+g.id).group)}catch(e){toast(e.message)}};
    b.append(pic,ti,pk.el,go)})}
function settings(){
  const g=cp,mine=g.owner===me.id,ch=g.type==='channel';
  sheet(ch?'Канал':'Группа',(b,close)=>{
    const pic=h('div','avw'),fi=document.createElement('input');fi.type='file';fi.accept='image/*';pic.append(av(g,'xl'));
    if(mine){pic.append(h('div','cam',ic('cam')));pic.onclick=()=>fi.click();
      fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{const url=await upload(await shrink(f,512),'image/jpeg');const ng=await api('/api/groups/'+g.id,{method:'PUT',body:JSON.stringify({avatar:url})});addGroup(ng);pic.replaceChildren(av(ng,'xl'),h('div','cam',ic('cam')));pic.firstChild.classList.add('bump')}catch{toast('Не удалось загрузить фото')}}}
    const ti=h('input','fld');ti.value=g.title;ti.maxLength=40;ti.disabled=!mine;b.append(pic,ti);
    if(mine){const sv=h('button','btn sec');sv.textContent='Сохранить название';sv.onclick=async()=>{try{addGroup(await api('/api/groups/'+g.id,{method:'PUT',body:JSON.stringify({title:ti.value})}));toast('Сохранено')}catch(e){toast(e.message)}};b.append(sv)}
    const box=h('div','accs');box.append(h('h4',null,(ch?'Подписчики':'Участники')+' · '+g.members.length));
    g.members.forEach((u,i)=>{let right=null;
      if(u.id===g.owner)right=h('span','chk','владелец');
      else if(mine){right=h('button','ib',ic('x'));right.onclick=async ev=>{ev.stopPropagation();try{await api(`/api/groups/${g.id}/members/${u.id}`,{method:'DELETE'});close();setTimeout(settings,320)}catch(e){toast(e.message)}}}
      const r=rowFor(u,i,'@'+u.nick,right);r.onclick=()=>{if(u.id!==me.id){close();openChat(u)}};box.append(r)});
    b.append(box);
    if(mine){const pk=picker(g.members.map(u=>u.id)),add=h('button','btn');add.textContent='Добавить выбранных';
      add.onclick=async()=>{if(!pk.sel.size)return toast('Выберите людей');try{addGroup(await api(`/api/groups/${g.id}/members`,{method:'POST',body:JSON.stringify({ids:[...pk.sel.keys()]})}));close();setTimeout(settings,320)}catch(e){toast(e.message)}};b.append(pk.el,add)}
    const out=h('button','btn red');out.textContent=mine?'Удалить '+(ch?'канал':'группу'):'Покинуть';
    out.onclick=async()=>{try{await api(mine?'/api/groups/'+g.id:`/api/groups/${g.id}/members/${me.id}`,{method:'DELETE'});close();gone(g.id)}catch(e){toast(e.message)}};b.append(out)})}

/* voice recording */
let rec,chunks,t0,rtick,rcancel;
async function startRec(){
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  const to=cp;rec=new MediaRecorder(s,mt?{mimeType:mt}:{});chunks=[];rcancel=false;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());clearInterval(rtick);$('#recbar').classList.add('hide');$('#inp').classList.remove('hide');if(rcancel)return;
    const dur=Math.round((Date.now()-t0)/1000);if(dur<1)return;
    try{const type=(rec.mimeType||mt||'audio/webm');const url=await upload(new Blob(chunks,{type}),type);if(cp&&to&&cp.id===to.id)send({type:'voice',url,dur})}catch{toast('Не удалось отправить голосовое')}};
  rec.start();t0=Date.now();$('#rt').textContent='0:00';rtick=setInterval(()=>$('#rt').textContent=fmt((Date.now()-t0)/1000),250);
  $('#inp').classList.add('hide');$('#recbar').classList.remove('hide')}catch{toast('Нет доступа к микрофону')}}
function cancelRec(){if(rec&&rec.state==='recording'){rcancel=true;rec.stop()}}
$('#rc').onclick=cancelRec;$('#rs').onclick=()=>{if(rec&&rec.state==='recording')rec.stop()};

/* profile */
function renderProfile(){
  const T=$('#tab-profile');T.innerHTML='';const p=h('div','prof');
  const w=h('div','avw');w.append(av(me,'xl'));w.append(h('div','cam',ic('cam')));w.onclick=()=>$('#f-ava').click();
  const nm=h('div');nm.style.textAlign='center';nm.innerHTML='<b style="font-size:22px"></b><div style="color:var(--mut)"></div>';nm.firstChild.textContent=me.name;nm.lastChild.textContent='@'+me.nick;
  const f=h('input','fld');f.value=me.name;f.maxLength=30;f.placeholder='Имя';
  const sv=h('button','btn sec');sv.textContent='Сохранить имя';
  sv.onclick=async()=>{try{me=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:f.value})});Object.assign(accs.find(a=>a.id===cur),me);saveA();renderProfile();toast('Сохранено')}catch(e){toast(e.message)}};
  const box=h('div','accs');box.append(h('h4',null,'Аккаунты'));
  accs.forEach((a,i)=>{const r=rowFor(a,i,'@'+a.nick,a.id===cur?h('span','chk','✓'):null);r.onclick=()=>a.id!==cur&&switchAcc(a.id);box.append(r)});
  const add=h('button','btn');add.textContent='+ Добавить аккаунт';add.onclick=()=>{$('#auth').classList.remove('hide');$('#a-cancel').classList.remove('hide');setMode('login')};
  const out=h('button','btn red');out.textContent='Выйти из аккаунта';
  out.onclick=()=>{accs=accs.filter(a=>a.id!==cur);cur=accs[0]&&accs[0].id;saveA();if(cur)switchAcc(cur);else{if(sock)sock.disconnect();showAuth(false)}};
  p.append(w,nm,f,sv,box,add,out);T.append(p);return w}
function switchAcc(id){cur=id;saveA();$('#app').classList.add('swap');setTimeout(start,250)}
$('#f-ava').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const url=await upload(await shrink(f,512),'image/jpeg');me=await api('/api/profile',{method:'PUT',body:JSON.stringify({avatar:url})});
  Object.assign(accs.find(a=>a.id===cur),me);saveA();renderProfile().firstChild.classList.add('bump');toast('Аватар обновлён')}catch{toast('Не удалось загрузить фото')}};

/* calls (WebRTC) */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let pc,ls,cpeer,ctimer,cto,pend=[],inc,muted=false;
function callUI(p,st,m){const c=$('#call');c.classList.add('on');c.classList.remove('live');c.dataset.mode=m;$('#c-av').replaceChildren(av(p,'xl'));$('#c-name').textContent=p.name;$('#c-st').textContent=st;muted=false;$('#c-mute').classList.remove('on')}
function mkPC(to){const p=new RTCPeerConnection(ICE);
  p.onicecandidate=e=>e.candidate&&sock.emit('call:ice',{to,c:e.candidate});
  p.ontrack=e=>{$('#ra').srcObject=e.streams[0];$('#ra').play().catch(()=>{})};
  p.onconnectionstatechange=()=>{const s=p.connectionState;if(s==='connected'){clearTimeout(cto);$('#call').classList.add('live');if(!ctimer){const t=Date.now();ctimer=setInterval(()=>$('#c-st').textContent=fmt((Date.now()-t)/1000),500)}}else if(s==='failed'){toast('Не удалось соединиться');endCall(true)}};
  return p}
async function mic(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch{toast('Нет доступа к микрофону');return null}}
async function startCall(p){
  if(pc||inc)return;ls=await mic();if(!ls)return;cpeer=p;callUI(p,'Вызов…','out');
  pc=mkPC(p.id);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('call:offer',{to:p.id,sdp:o});
  cto=setTimeout(()=>{toast('Нет ответа');endCall(true)},45000)}
async function acceptCall(){
  const i=inc;inc=null;ls=await mic();if(!ls){sock.emit('call:end',{to:i.from});return endCall(false)}
  pc=mkPC(i.from);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  await pc.setRemoteDescription(i.sdp);for(const c of pend)await pc.addIceCandidate(c);pend=[];
  const a=await pc.createAnswer();await pc.setLocalDescription(a);sock.emit('call:answer',{to:i.from,sdp:a});
  $('#call').dataset.mode='out';$('#c-st').textContent='Соединение…'}
function endCall(notify){
  if(notify&&cpeer&&sock)sock.emit('call:end',{to:cpeer.id});
  if(pc)pc.close();pc=null;if(ls)ls.getTracks().forEach(t=>t.stop());ls=null;
  clearInterval(ctimer);ctimer=null;clearTimeout(cto);pend=[];inc=null;cpeer=null;$('#ra').srcObject=null;$('#call').classList.remove('on')}
$('#callbtn').onclick=()=>{if(cp)startCall(cp)};
$('#c-acc').onclick=acceptCall;
$('#c-dec').onclick=()=>endCall(true);$('#c-end').onclick=()=>endCall(true);
$('#c-mute').onclick=()=>{muted=!muted;if(ls)ls.getAudioTracks().forEach(t=>t.enabled=!muted);$('#c-mute').classList.toggle('on',muted)};

/* boot */
if(cur&&accs.find(a=>a.id===cur))start();else if(accs.length){cur=accs[0].id;start()}else showAuth(false);
</script>
